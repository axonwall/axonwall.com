      <path d="M24 12.5 L24 21.5" stroke="url(#axonLineOg)" stroke-width="1.4" stroke-linecap="round" />
      <path d="M24 21.5 L16.5 17" stroke="url(#axonLineOg)" stroke-width="1.4" stroke-linecap="round" />
      <path d="M24 21.5 L31.5 17" stroke="url(#axonLineOg)" stroke-width="1.4" stroke-linecap="round" />
      <path d="M24 21.5 L17.5 28" stroke="url(#axonLineOg)" stroke-width="1.4" stroke-linecap="round" />
      <path d="M24 21.5 L30.5 28" stroke="url(#axonLineOg)" stroke-width="1.4" stroke-linecap="round" />
      <circle cx="24" cy="12.5" r="2" fill="#34d399" />
      <circle cx="16.5" cy="17" r="1.8" fill="#38bdf8" />
      <circle cx="31.5" cy="17" r="1.8" fill="#38bdf8" />
      <circle cx="17.5" cy="28" r="1.8" fill="#10b981" />
      <circle cx="30.5" cy="28" r="1.8" fill="#10b981" />
      <circle cx="24" cy="21.5" r="3.1" fill="#042f2e" stroke="#34d399" stroke-width="1.7" />
      <circle cx="24" cy="21.5" r="1.3" fill="#ffffff" />

      <!-- Crossed Axes in Front of Shield -->
      <path d="M10.5 13 L35 41" stroke="#020617" stroke-opacity="0.85" stroke-width="3.8" stroke-linecap="round" />
      <path d="M37.5 13 L13 41" stroke="#020617" stroke-opacity="0.85" stroke-width="3.8" stroke-linecap="round" />
      <path d="M10.5 13 L35 41" stroke="url(#axeHaftOg)" stroke-width="2.1" stroke-linecap="round" />
      <path d="M11.4 11.4 L6.2 11.4 L2.6 10.2 C1.8 14 3.2 18.2 6.4 21.6 L9.8 17.6 L12.2 15.6 Z" fill="url(#axeBladeLeftOg)" stroke="#34d399" stroke-width="1.1" stroke-linejoin="round" />
      <path d="M37.5 13 L13 41" stroke="url(#axeHaftOg)" stroke-width="2.1" stroke-linecap="round" />
      <path d="M36.6 11.4 L41.8 11.4 L45.4 10.2 C46.2 14 44.8 18.2 41.6 21.6 L38.2 17.6 L35.8 15.6 Z" fill="url(#axeBladeRightOg)" stroke="#38bdf8" stroke-width="1.1" stroke-linejoin="round" />
    </g>

    <text x="116" y="48" font-family="'Noto Sans', 'Liberation Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">AXONWALL</text>
    <rect x="344" y="20" width="132" height="34" rx="17" fill="#064e3b" fill-opacity="0.7" stroke="#10b981" stroke-width="1.5" />
    <text x="410" y="42" text-anchor="middle" font-family="'JetBrainsMono NF', 'DejaVu Sans Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#34d399">v0.16.3</text>

    <text x="116" y="78" font-family="'JetBrainsMono NF', 'DejaVu Sans Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#94a3b8">DEBIAN 13 TRIXIE • LINUX 6.12 LTS • PORT 2966 CONSOLE • 100% GPLv2</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(84, 238)">
    <text x="0" y="0" font-family="'Noto Sans', 'Liberation Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1.2">Sovereign Linux NGFW, ZFS NAS,</text>
    <text x="0" y="66" font-family="'Noto Sans', 'Liberation Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="url(#brandAccent)" letter-spacing="-1.2">K3s, KVM &amp; Autonomous AI SOC.</text>
    <text x="0" y="122" font-family="'Noto Sans', 'Liberation Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="400" fill="#cbd5e1">Lean Router/NGFW Core (47 plugins &amp; 4 Starter Packs), line-rate nftables + XDP,</text>
    <text x="0" y="156" font-family="'Noto Sans', 'Liberation Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="400" fill="#cbd5e1">CO-RE BPF-LSM Ring-0 guard, ZFSBootMenu &amp; Btrfs Snapper, PQ Rosenpass.</text>
  </g>

  <!-- Bottom Capability Pills -->
  <g transform="translate(84, 468)" font-family="'JetBrainsMono NF', 'DejaVu Sans Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600">
    <g transform="translate(0, 0)">
      <rect width="248" height="44" rx="10" fill="#0f172a" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.5" />
      <text x="124" y="27" text-anchor="middle" fill="#34d399">nftables + XDP Fastpath</text>
    </g>
    <g transform="translate(264, 0)">
      <rect width="256" height="44" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5" />
      <text x="128" y="27" text-anchor="middle" fill="#38bdf8">CO-RE BPF-LSM Ring-0</text>
    </g>
    <g transform="translate(536, 0)">
      <rect width="268" height="44" rx="10" fill="#0f172a" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.5" />
      <text x="134" y="27" text-anchor="middle" fill="#34d399">McEliece + ML-KEM-512</text>
