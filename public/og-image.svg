    <linearGradient id="axeHaftOg" x1="10" y1="12" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="axeBladeLeftOg" x1="3" y1="10" x2="14" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="55%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="axeBladeRightOg" x1="45" y1="10" x2="34" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="brickWall" width="96" height="48" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="46" height="22" rx="2" fill="#0b1322" fill-opacity="0.45" stroke="#10b981" stroke-opacity="0.14" stroke-width="1" />
      <rect x="49" y="1" width="46" height="22" rx="2" fill="#0f172a" fill-opacity="0.4" stroke="#06b6d4" stroke-opacity="0.12" stroke-width="1" />
      <rect x="-23" y="25" width="46" height="22" rx="2" fill="#0f172a" fill-opacity="0.4" stroke="#06b6d4" stroke-opacity="0.12" stroke-width="1" />
      <rect x="25" y="25" width="46" height="22" rx="2" fill="#0b1322" fill-opacity="0.45" stroke="#10b981" stroke-opacity="0.14" stroke-width="1" />
      <rect x="73" y="25" width="46" height="22" rx="2" fill="#0f172a" fill-opacity="0.4" stroke="#06b6d4" stroke-opacity="0.12" stroke-width="1" />
